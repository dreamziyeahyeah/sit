<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sit</title>
<meta name="description" content="A quiet meditation timer.">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1d1a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Sit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app" class="pick">
  <header class="bar">
    <span class="bar-title">Sit</span>
  </header>

  <div class="face">
    <div class="stage">
      <canvas id="dial" class="dial" aria-hidden="true"></canvas>
      <div class="readout">
        <div id="minutes" class="minutes">10</div>
        <div id="unit" class="unit">min</div>
        <div id="status" class="status" hidden></div>
      </div>
      <div id="hint" class="hint" hidden></div>
      <div class="hold" aria-hidden="true"></div>
    </div>
    <canvas id="ruler" class="ruler" aria-hidden="true"></canvas>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
